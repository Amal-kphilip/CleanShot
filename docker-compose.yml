version: '3.8'

services:
  cleanshot:
    build:
      context: .
      dockerfile: Dockerfile
    image: cleanshot:latest
    container_name: cleanshot-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    resources:
      limits:
        memory: 1024M
