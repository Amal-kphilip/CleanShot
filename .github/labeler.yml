engine:
  - changed-files:
      - any-glob-to-any-file:
          - "src/lib/engine/**"

ui:
  - changed-files:
      - any-glob-to-any-file:
          - "src/components/**"
          - "src/app/**"

tests:
  - changed-files:
      - any-glob-to-any-file:
          - "**/__tests__/**"
          - "tests/**"

docs:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "*.md"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "package*.json"
